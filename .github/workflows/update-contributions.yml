name: Refresh contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install minimal runtime dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Fetch public activity and render SVG
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/validate_profile.py

      - name: Commit updated profile art when changed
        run: |
          if git diff --quiet -- data/contributions.json assets/contribution-heatmap.svg; then
            echo "Contribution art is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-heatmap.svg
          git commit -m "chore: refresh contribution activity [skip ci]"
          git push
